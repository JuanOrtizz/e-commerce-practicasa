name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ecommerce_practicasa_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r project/requirements.txt

      - name: Run tests
        run: |
          cd project
          python -m pytest -v
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ecommerce_practicasa_db
          SECRET_KEY: clave-ci-no-segura
          DEBUG: True
