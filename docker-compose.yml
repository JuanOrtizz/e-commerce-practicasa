services:
  django:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./project:/app
    command: sh -c "sleep 5 && python manage.py migrate && python manage.py shell < project/create_superuser.py && python manage.py runserver 0.0.0.0:8000"
    depends_on:
        - postgres
    env_file:
      - .env

  postgres:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
        - postgres

volumes:
  postgres_data: