{% load static %}

<!doctype html>
<html lang="es-ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{% static 'img/favicon.webp' %}" type="image/x-icon">
    <link rel="shortcut icon" href="{% static 'img/favicon.png' %}" type="image/x-icon">
    <title>{% block title %} {% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{{ SITE_EMPRESA }}{% endblock %}">
    <meta name="robots" content="{% block meta_robots %}index, follow{% endblock %}">
    <link rel="canonical" href="{% block canonical %}{{ canonical_url }}{% endblock %}">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:site_name" content="Practicasa">
    <meta property="og:locale" content="es_AR">
    <meta property="og:title" content="{% block og_title %}Practicasa{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{{ SITE_EMPRESA }}{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{{ canonical_url }}{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{{ SITE_LOGO }}{% endblock %}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}Practicasa{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}{{ SITE_EMPRESA }}{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}{{ SITE_LOGO }}{% endblock %}">
    {% block json_ld %}
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ SITE_URL }}/#website",
      "name": "{{ SITE_NOMBRE }}",
      "url": "{{ SITE_URL }}/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "{{ SITE_URL }}/productos/search/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    },
    {
      "@type": "Organization",
      "@id": "{{ SITE_URL }}/#organization",
      "name": "{{ SITE_NOMBRE }}",
      "url": "{{ SITE_URL }}/",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ SITE_LOGO }}"
      },
      "sameAs": [
        "{{ SITE_REDES.tiktok }}",
        "{{ SITE_REDES.facebook }}",
        "{{ SITE_REDES.instagram }}"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "{{ SITE_TELEFONO_INTL }}",
        "contactType": "customer service",
        "areaServed": "AR",
        "availableLanguage": "es"
      }
    }
  ]
}
    </script>
    {% endblock %}
    {% block extra_json_ld %}{% endblock %}
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/globalStyles.css' %}">
    <link rel="stylesheet" href="{% static 'css/compartidoCheckout.css' %}">
    {% block extra_css%} {% endblock %}
</head>
<body>

{% include 'header.html' %}

<main class="d-flex flex-column">
    {% block content %} {% endblock %}
</main>

{% include 'footer.html' %}

<button class="btn-subir" id="btnSubir" aria-label="Volver arriba">
    <span class="material-symbols-outlined">arrow_upward</span>
</button>

<a class="btn-whatsapp" href="https://wa.me/543435468162" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
    <img src="{% static 'img/logo_whatsapp.png' %}" alt="WhatsApp">
</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js" integrity="sha384-XmJ9SoHtVOHoQUcKvFAzVXwdkKo1Ie3bhmSoIAkcdsHGaIrVJIkmozyq0FJeb/Ly" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js" integrity="sha384-wl5TeDVvOWt30Pbf8aSo2ZrzsOjddu3avOBvHe+p+OhJt9gP6w9YXmDkN5DK2/dF" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" integrity="sha384-nLoOnA/BDh8A/jxqtckg4DumuCGOBYUnNJLZdQz/zfYNp3wcjGSoWTAzgko06G/2" crossorigin="anonymous"></script>
<script src="{% static 'js/animaciones.js' %}"></script>
<script type="module" src="{% static 'js/buscador.js' %}"></script>
{% block extra_js %} {% endblock %}
</body>
</html>
