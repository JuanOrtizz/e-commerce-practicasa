{% load static %}

<!doctype html>
<html lang="es-ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{% static 'img/favicon.webp' %}" type="image/x-icon">
    <link rel="shortcut icon" href="{% static 'img/favicon.png' %}" type="image/x-icon">
    <title>{% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/globalStyles.css' %}">
    {% block extra_css%} {% endblock %}
</head>
<body>

{% include 'header.html' %}

<main class="d-flex flex-column">
    {% block content %} {% endblock %}
</main>

{% include 'footer.html' %}

<button class="btn-subir" id="btnSubir" aria-label="Volver arriba">
    <span class="material-symbols-outlined">arrow_upward</span>
</button>

<a class="btn-whatsapp" href="https://wa.me/543435468162" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
    <img src="{% static 'img/logo_whatsapp.png' %}" alt="WhatsApp">
</a>

<script src=https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{% static 'js/animaciones.js' %}"></script>
{% block extra_js %} {% endblock %}
</body>
</html>
